services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: razorchain_ai
      POSTGRES_USER: razorchain
      POSTGRES_PASSWORD: razorchain_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://razorchain:razorchain_dev@db:5432/razorchain_ai
      NEXTAUTH_SECRET: change-me-in-production
    ports:
      - "3000:3000"
volumes:
  postgres_data:
